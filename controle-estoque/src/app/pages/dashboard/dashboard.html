<h1>DashBoard</h1>

<h2>Lista de Produtos</h2>

@if (loading()) {
<p>Carregando produtos...</p>
} @else {
    
<div>

    @for(produto of produtos(); track produto.id){
    <mat-card class="example-card" appearance="outlined">
        <mat-card-header>
            <mat-card-title>{{ produto.title }}</mat-card-title>
        </mat-card-header>
        <img mat-card-image src="{{ produto.image }}" alt="Photo of {{ produto.title }}">
        <mat-card-content>
            <p>
                {{ produto.description }}
            </p>
        </mat-card-content>
        <mat-card-actions>
            <button matButton>LIKE</button>
            <button matButton>SHARE</button>
        </mat-card-actions>
    </mat-card>
    }
</div>

}
